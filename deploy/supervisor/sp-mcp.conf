[program:sp-mcp]
command=/var/www/slp/sp-mcp/sp-mcp -config /var/www/slp/sp-mcp/config.json -listen 127.0.0.1:18081
directory=/var/www/slp/sp-mcp
autostart=true
autorestart=true
startsecs=3
stdout_logfile=/var/log/supervisor/sp-mcp.log
stderr_logfile=/var/log/supervisor/sp-mcp.err.log
user=www-data
