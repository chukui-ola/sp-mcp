[program:sp-mcp]
directory=/var/www/slp/sp-mcp
command=/var/www/slp/sp-mcp/sp-mcp -config /var/www/slp/sp-mcp/config.json -listen 127.0.0.1:18082
autostart=true
autorestart=true
startsecs=3
startretries=3
stopsignal=TERM
stopwaitsecs=10
user=jenkins
redirect_stderr=true
stdout_logfile=/var/log/supervisor/sp-mcp.log
stdout_logfile_maxbytes=50MB
stdout_logfile_backups=5
environment=HOME="/var/lib/jenkins",USER="jenkins",PATH="/usr/local/bin:/usr/bin:/bin"
